name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - claude/deploy-zavod-cc-site-lzf68r
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy the repo root as static assets to the existing "zavod" project.
          # --branch must equal the project's PRODUCTION branch so the custom
          # domain (zavod.bz) is updated. Change "main" if your production
          # branch differs (Cloudflare -> Pages -> zavod -> Settings -> Branches).
          command: pages deploy . --project-name=zavod --branch=main --commit-dirty=true
